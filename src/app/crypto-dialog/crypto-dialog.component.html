<h2 mat-dialog-title>Crypto Details</h2>
<mat-dialog-content>
    <div class="details-container">
        <h1>Coin Name: {{data.coin}}</h1>
        <h3>Network: {{data.network}}</h3>
        <h3>Wallet ID: {{data.wallet}}</h3>
    </div>
</mat-dialog-content>
<mat-dialog-actions>
    <button mat-button (click)="onClose()" class="button">
        Close
    </button>
</mat-dialog-actions>
